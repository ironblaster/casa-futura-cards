name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  attach:
    name: Attach the card to the release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check that the version in the file matches the tag
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          grep -q "var VERSION = '${TAG}';" dist/casa-futura-cards.js || { echo "VERSION in the file is not ${TAG}"; exit 1; }
      - name: Upload casa-futura-cards.js
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$GITHUB_REF_NAME" dist/casa-futura-cards.js --clobber
