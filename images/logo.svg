<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#16203a"/><stop offset="1" stop-color="#05070c"/>
    </linearGradient>
    <radialGradient id="glowA" cx="18%" cy="12%" r="70%"><stop offset="0" stop-color="#00aaff" stop-opacity=".55"/><stop offset="1" stop-color="#00aaff" stop-opacity="0"/></radialGradient>
    <radialGradient id="glowB" cx="92%" cy="88%" r="70%"><stop offset="0" stop-color="#9646ff" stop-opacity=".5"/><stop offset="1" stop-color="#9646ff" stop-opacity="0"/></radialGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5ff3ff"/><stop offset="1" stop-color="#b98bff"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".22"/><stop offset=".45" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="neon" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect x="8" y="8" width="240" height="240" rx="64" fill="url(#bg)"/>
  <rect x="8" y="8" width="240" height="240" rx="64" fill="url(#glowA)"/>
  <rect x="8" y="8" width="240" height="240" rx="64" fill="url(#glowB)"/>
  <rect x="8" y="8" width="240" height="240" rx="64" fill="url(#sheen)"/>
  <rect x="8.75" y="8.75" width="238.5" height="238.5" rx="63.25" fill="none" stroke="#ffffff" stroke-opacity=".22" stroke-width="1.5"/>
  <!-- house drawn by one glowing line, with a doorway in the floor -->
  <path d="M110 186 H74 V118 L128 72 L182 118 V186 H146" fill="none" stroke="url(#line)" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" filter="url(#neon)"/>
  <!-- the light at home -->
  <circle cx="128" cy="140" r="13" fill="#ffffff" filter="url(#neon)"/>
  <circle cx="128" cy="140" r="22" fill="none" stroke="#5ff3ff" stroke-opacity=".45" stroke-width="2"/>
</svg>
